<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
  <title>Las Rosas | Iniciar sesión</title>
</head>
<body class="login-page">
  <main class="login-container">
    <section class="login-box">
      <div class="brand">LAS ROSAS</div>
      <span class="tag">SISTEMA DE GESTIÓN</span>
      <h1>Iniciar sesión</h1>
      <p class="subtitle">Acceso según el rol asignado</p>
      <form id="loginForm">
        <div class="input-group">
          <label for="email">Correo</label>
          <input type="email" id="email" placeholder="admin@lasrosas.com" required>
        </div>
        <div class="input-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-login">Ingresar</button>
        <p id="loginMessage" class="login-message"></p>
      </form>
      <div class="demo-access">
        <strong>Credenciales de demostración</strong>
        <span>Administrador: admin@lasrosas.com / admin123</span>
        <span>Mozo: maria@lasrosas.com / mozo123</span>
        <span>Cajero: carlos@lasrosas.com / cajero123</span>
      </div>
    </section>
  </main>
  <script src="login.js"></script>
</body>
</html>
